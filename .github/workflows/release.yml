name: Release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  version:
    name: Tag matches the version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare the tag with entitlerSDKVersion
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^public let entitlerSDKVersion = "\(.*\)"$/\1/p' Sources/Entitler/Version.swift)
          if [ "$TAG" != "$version" ]; then
            echo "The tag $TAG does not match entitlerSDKVersion $version."
            exit 1
          fi

  checks:
    name: Checks
    needs: version
    uses: ./.github/workflows/ci.yml
    secrets:
      ENTITLER_TEST_KEY: ${{ secrets.ENTITLER_TEST_KEY }}

  release:
    name: GitHub release
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create or update the release with the changelog's notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          awk -v tag="$TAG" '
            $0 ~ "^## \\[" tag "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for $TAG."
            exit 1
          fi
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release edit "$TAG" --repo "$REPO" --notes-file notes.md
          else
            gh release create "$TAG" --repo "$REPO" --title "$TAG" --notes-file notes.md --verify-tag
          fi
