name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-24.04
    container: swift:6.4-noble@sha256:19cbe56bdaec1918f7cf5fdeba42b9bd55bdd8a6149c9990d0e0e3a89a127d63
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/lint.sh

  generated:
    name: Wire types match openapi.json
    runs-on: ubuntu-24.04
    container: swift:6.4-noble@sha256:19cbe56bdaec1918f7cf5fdeba42b9bd55bdd8a6149c9990d0e0e3a89a127d63
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/generate.sh
      - run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git diff --exit-code -- Sources/Entitler/Wire.gen.swift

  test:
    name: Test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Linux, Swift 6.0", os: ubuntu-24.04, container: "swift:6.0-noble@sha256:f19aea3f9a889df5884e1186e60be74869613477d99656b598c115a4b91af8a1" }
          - { name: "Linux, Swift 6.4", os: ubuntu-24.04, container: "swift:6.4-noble@sha256:19cbe56bdaec1918f7cf5fdeba42b9bd55bdd8a6149c9990d0e0e3a89a127d63", sanitize: true }
          - { name: "macOS, newest Xcode", os: macos-15, apple: true }
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select the newest Xcode
        if: ${{ matrix.apple }}
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
      - run: swift build --build-tests -Xswiftc -warnings-as-errors
      - run: swift test --skip-build
      - name: Thread Sanitizer
        if: ${{ matrix.sanitize }}
        run: swift test --sanitize=thread

  all-checks-passed:
    name: All checks passed
    if: always()
    needs: [lint, generated, test]
    runs-on: ubuntu-24.04
    steps:
      - name: Fail unless every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "A required job finished with $result."
              exit 1
            fi
          done
